# UI strings, English. Keep the keys in sync with de.yaml.
# Placeholders are written as {name} and filled by App\I18n\Translator::trans().

title: 'Timetable {day}'

app:
    name: 'WebUntis Dashboard'
    description: 'Timetable and homework at a glance'

date:
    long: '{weekday}, {day} {month}'
    short: '{weekday}, {year}-{month}-{day}'
    compact: '{weekday}, {month}/{day}'

status:
    none: 'Everything is on schedule.'
    one: 'One lesson differs from the plan.'
    many: '{count} lessons differ from the plan.'

student:
    error: 'No timetable available. {message}'
    empty: 'No lessons scheduled for today.'

lesson:
    cancelled: 'cancelled'
    substitution: 'Substitution'
    substitution_for: 'Substitution for {teachers}'
    free: 'Free period, next lesson at {time}'

homework:
    title: 'Homework'
    none: 'No open homework.'
    due: 'due {date}'

nav:
    timetable: 'Timetable'
    homework: 'Homework'

header:
    pager: 'Change day'

footer:
    updated: 'Fetched at {time}'
    today: 'Back to today'
    tagline: 'Built with {heart} for open source'
    source: 'Source on GitHub'
    author: 'by {name}'
    license: 'MIT licensed'

weekdays:
    1: Monday
    2: Tuesday
    3: Wednesday
    4: Thursday
    5: Friday
    6: Saturday
    7: Sunday

weekdays_short:
    1: Mon
    2: Tue
    3: Wed
    4: Thu
    5: Fri
    6: Sat
    7: Sun

months:
    1: January
    2: February
    3: March
    4: April
    5: May
    6: June
    7: July
    8: August
    9: September
    10: October
    11: November
    12: December
