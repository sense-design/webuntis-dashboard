# UI strings, German. Keep the keys in sync with en.yaml.
# Placeholders are written as {name} and filled by App\I18n\Translator::trans().

title: 'Stundenplan {day}'

app:
    name: 'WebUntis-Dashboard'
    description: 'Stundenplan und Hausaufgaben auf einen Blick'

date:
    long: '{weekday}, {day}. {month}'
    short: '{weekday}, {day}.{month}.{year}'
    compact: '{weekday}, {day}.{month}.'

status:
    none: 'Alles läuft nach Plan.'
    one: 'Eine Stunde weicht vom Plan ab.'
    many: '{count} Stunden weichen vom Plan ab.'

student:
    error: 'Kein Plan abrufbar. {message}'
    empty: 'Für heute ist kein Unterricht eingetragen.'

lesson:
    cancelled: 'fällt aus'
    substitution: 'Vertretung'
    substitution_for: 'Vertretung für {teachers}'
    free: 'Freistunde, nächste Stunde um {time}'

homework:
    title: 'Hausaufgaben'
    none: 'Keine offenen Hausaufgaben.'
    due: 'fällig {date}'

nav:
    timetable: 'Stundenplan'
    homework: 'Hausaufgaben'

header:
    pager: 'Tag wechseln'

footer:
    updated: 'Abgerufen um {time}'
    today: 'Zurück zu heute'
    tagline: 'Mit {heart} für Open Source gebaut'
    source: 'Quellcode auf GitHub'
    author: 'von {name}'
    license: 'MIT-Lizenz'

