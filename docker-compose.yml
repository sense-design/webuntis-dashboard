services:
    webuntis-dashboard:
        build: .
        restart: unless-stopped
        ports:
            - "8080:80"
        env_file:
            - .env.docker
        volumes:
            - ./config/untis.yaml:/var/www/html/config/untis.yaml:ro
            - webuntis-dashboard-var:/var/www/html/var

volumes:
    webuntis-dashboard-var:
