# nginx side of the Docker image. The bare-metal equivalent is
# nginx.conf.example at the repo root - this is the same vhost with TLS and
# the host-specific bits (server_name, cert paths) stripped, since a
# container has no fixed hostname and TLS is expected to be terminated by
# whatever sits in front of it (see "Docker" in README.md).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;

    # A plain HTML page instead of nginx's stock error page, for the
    # dotfile-block deny rule below (returns 403). A static file nginx
    # serves directly, so it renders even if PHP-FPM is down.
    #
    # The exact-match override below matters if a `deny all;` ever ends up
    # server-wide here too (e.g. copying the IP allowlist from
    # nginx.conf.example into a reverse proxy in front of this container):
    # without it, nginx's own attempt to fetch /403.html for the error
    # response would itself get denied, silently falling back to nginx's
    # plain-text 403 instead.
    error_page 403 /403.html;
    location = /403.html {
        allow all;
        internal;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Only the front controller may run. Every other .php path is denied so a
    # stray script under public/ can never be executed.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    # Static assets: let the browser cache them, they are versioned by name.
    # Always reachable regardless of any access restriction in front - there
    # is nothing sensitive in here, and 403.html needs its stylesheet even
    # when the visitor is denied everything else.
    location /assets/ {
        allow all;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Home screen / favicon images live at the document root. The manifest
    # itself is served by the app (a localised route), not from here. Always
    # reachable, same reasoning as /assets/ above - 403.html links the icon.
    location ~* ^/(?:apple-touch-icon|icon(?:-\d+)?|favicon)\.(?:png|svg|ico)$ {
        allow all;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Never serve dotfiles or the config directory, whatever the document root.
    location ~ /\. {
        deny all;
    }

    access_log /dev/stdout;
    error_log /dev/stderr;
}
