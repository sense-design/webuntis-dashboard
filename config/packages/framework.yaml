framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    # This app has no encrypted secrets vault. Disabling it keeps the SodiumVault
    # env-var loader out of the container, which would otherwise pull in
    # symfony/string (LazyString) just to resolve %env(APP_SECRET)%.
    secrets: false
    php_errors:
        log: true
    cache:
        app: cache.adapter.filesystem
    # asset() appends each file's own mtime as a cache-buster (see
    # App\Asset\MtimeVersionStrategy), so nginx can cache /assets/ hard
    # without the browser holding on to a stale style.css after a deploy.
    assets:
        version_strategy: App\Asset\MtimeVersionStrategy
